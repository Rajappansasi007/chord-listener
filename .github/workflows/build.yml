name: Build Chord Listener

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create app project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/chordlistener/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ChordListener'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.chordlistener.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.chordlistener.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Chord Listener"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/chordlistener/app/MainActivity.java <<'EOF'
          package com.chordlistener.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.view.View;
          import android.widget.*;
          import java.io.*;

          public class MainActivity extends Activity {
              private MediaPlayer player;
              private Spinner instrument;
              private TextView status;
              private int lastRoot = -1;
              private boolean lastMinor;
              private int fileNumber = 0;

              private final String[] roots = {
                  "C", "C#", "D", "D#", "E", "F",
                  "F#", "G", "G#", "A", "A#", "B"
              };
              private final String[] sounds = {
                  "Piano", "Strings", "Violin", "Saxophone", "Synth"
              };
              private final int[] programs = {0, 48, 40, 65, 80};

              @Override
              public void onCreate(Bundle saved) {
                  super.onCreate(saved);

                  LinearLayout body = new LinearLayout(this);
                  body.setOrientation(LinearLayout.VERTICAL);
                  body.setPadding(dp(18), dp(24), dp(18), dp(24));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(body);
                  setContentView(scroll);

                  label(body, "Chord Listener", 28);
                  label(body, "Choose an instrument, then tap a chord.", 16);

                  instrument = new Spinner(this);
                  instrument.setAdapter(new ArrayAdapter<String>(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      sounds
                  ));
                  body.addView(instrument);

                  status = label(body, "Ready — turn up media volume", 18);

                  instrument.setOnItemSelectedListener(
                      new AdapterView.OnItemSelectedListener() {
                          public void onItemSelected(
                              AdapterView<?> parent, View view,
                              int position, long id
                          ) {
                              if (lastRoot >= 0) play(lastRoot, lastMinor);
                          }
                          public void onNothingSelected(AdapterView<?> parent) {}
                      }
                  );

                  section(body, "Major chords", false);
                  section(body, "Minor chords", true);

                  Button replay = new Button(this);
                  replay.setText("Replay");
                  replay.setOnClickListener(v -> {
                      if (lastRoot >= 0) play(lastRoot, lastMinor);
                  });
                  body.addView(replay);

                  Button stop = new Button(this);
                  stop.setText("Stop");
                  stop.setOnClickListener(v -> {
                      stopAudio();
                      status.setText("Stopped");
                  });
                  body.addView(stop);

                  label(body,
                      "Offline MIDI sounds. Headphones recommended.
" +
                      "Instrument tone may vary by phone.", 14);
              }

              private TextView label(LinearLayout body, String text, int size) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setPadding(0, dp(10), 0, dp(10));
                  body.addView(view);
                  return view;
              }

              private void section(
                  LinearLayout body, String title, boolean minor
              ) {
                  label(body, title, 21);
                  for (int r = 0; r < 4; r++) {
                      LinearLayout row = new LinearLayout(this);
                      for (int c = 0; c < 3; c++) {
                          final int root = r * 3 + c;
                          Button button = new Button(this);
                          button.setAllCaps(false);
                          button.setText(roots[root] + (minor ? "m" : ""));
                          button.setOnClickListener(v -> play(root, minor));
                          row.addView(button, new LinearLayout.LayoutParams(
                              0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f
                          ));
                      }
                      body.addView(row);
                  }
              }

              private void play(int root, boolean minor) {
                  stopAudio();
                  lastRoot = root;
                  lastMinor = minor;

                  int middle = minor ? 3 : 4;
                  int[] notes = {60 + root, 60 + root + middle, 67 + root};
                  int choice = instrument.getSelectedItemPosition();

                  status.setText(
                      roots[root] + (minor ? " minor" : " major") + "
" +
                      roots[root] + " – " + roots[(root + middle) % 12] +
                      " – " + roots[(root + 7) % 12] + "
" + sounds[choice]
                  );

                  File file = new File(
                      getCacheDir(), "chord_" + (fileNumber++) + ".mid"
                  );

                  try {
                      try (FileOutputStream out = new FileOutputStream(file)) {
                          out.write(makeMidi(notes, programs[choice]));
                      }

                      MediaPlayer current = new MediaPlayer();
                      player = current;
                      current.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      );
                      current.setOnPreparedListener(p -> {
                          file.delete();
                          if (player == p) p.start();
                      });
                      current.setOnCompletionListener(p -> {
                          if (player == p) {
                              player = null;
                              p.release();
                          }
                      });
                      current.setOnErrorListener((p, what, extra) -> {
                          file.delete();
                          if (player == p) {
                              player = null;
                              p.release();
                              status.setText("Playback failed. Try another chord.");
                          }
                          return true;
                      });
                      current.setDataSource(file.getAbsolutePath());
                      current.prepareAsync();
                  } catch (Exception e) {
                      stopAudio();
                      file.delete();
                      status.setText("Cannot play: " + e.getMessage());
                  }
              }

              private byte[] makeMidi(int[] notes, int program)
                  throws IOException {
                  ByteArrayOutputStream trackBytes = new ByteArrayOutputStream();
                  DataOutputStream track = new DataOutputStream(trackBytes);

                  track.write(new byte[] {
                      0, (byte) 0xFF, 0x51, 3, 7, (byte) 0xA1, 0x20
                  });

                  track.writeByte(0);
                  track.writeByte(0xC0);
                  track.writeByte(program);

                  for (int note : notes) {
                      track.writeByte(0);
                      track.writeByte(0x90);
                      track.writeByte(note);
                      track.writeByte(85);
                  }

                  for (int i = 0; i < notes.length; i++) {
                      variable(track, i == 0 ? 1920 : 0);
                      track.writeByte(0x80);
                      track.writeByte(notes[i]);
                      track.writeByte(0);
                  }

                  variable(track, 480);
                  track.writeByte(0xFF);
                  track.writeByte(0x2F);
                  track.writeByte(0);
                  track.flush();

                  ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                  DataOutputStream output = new DataOutputStream(bytes);
                  output.writeBytes("MThd");
                  output.writeInt(6);
                  output.writeShort(0);
                  output.writeShort(1);
                  output.writeShort(480);
                  output.writeBytes("MTrk");
                  output.writeInt(trackBytes.size());
                  output.write(trackBytes.toByteArray());
                  output.flush();
                  return bytes.toByteArray();
              }

              private void variable(DataOutputStream out, int value)
                  throws IOException {
                  int packed = value & 127;
                  while ((value >>>= 7) > 0) {
                      packed = (packed << 8) | ((value & 127) | 128);
                  }
                  while (true) {
                      out.writeByte(packed & 255);
                      if ((packed & 128) == 0) break;
                      packed >>>= 8;
                  }
              }

              private void stopAudio() {
                  if (player != null) {
                      player.setOnPreparedListener(null);
                      player.setOnCompletionListener(null);
                      player.setOnErrorListener(null);
                      player.release();
                      player = null;
                  }
                  File[] files = getCacheDir().listFiles();
                  if (files != null) {
                      for (File file : files) {
                          if (file.getName().startsWith("chord_")) file.delete();
                      }
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  stopAudio();
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density
                  );
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chord-Listener-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
