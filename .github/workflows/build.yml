name: Build Chord Listener

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & Platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache: 'gradle'

      - name: Create app project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/chordlistener/app
          mkdir -p app/src/main/res

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'ChordListener'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.chordlistener.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.chordlistener.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Chord Listener"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/chordlistener/app/MainActivity.java <<'EOF'
          package com.chordlistener.app;

          import android.app.Activity;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.DataOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends Activity {
              private MediaPlayer player;
              private Spinner instrumentSpinner;
              private Spinner chordTypeSpinner;
              private Spinner playbackModeSpinner;
              private TextView status;
              private int lastRoot = -1;
              private int fileNumber = 0;

              private final String[] roots = {
                  "C", "C#", "D", "D#", "E", "F",
                  "F#", "G", "G#", "A", "A#", "B"
              };

              private final String[] sounds = {
                  "Piano", "Strings", "Violin", "Saxophone", "Synth"
              };

              private final int[] programs = {0, 48, 40, 65, 80};

              private final String[] chordTypeNames = {
                  "Major", "Minor", "Major 7th", "Dominant 7th", "Minor 7th"
              };

              private final int[][] chordIntervals = {
                  {0, 4, 7},       // Major
                  {0, 3, 7},       // Minor
                  {0, 4, 7, 11},   // Major 7th
                  {0, 4, 7, 10},   // Dominant 7th
                  {0, 3, 7, 10}    // Minor 7th
              };

              private final String[] playbackModeNames = {
                  "Normal (One-shot)", "Continuous Hold (Stretch)", "Repeating Loop"
              };

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout body = new LinearLayout(this);
                  body.setOrientation(LinearLayout.VERTICAL);
                  body.setPadding(dp(20), dp(24), dp(20), dp(24));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(body);
                  setContentView(scroll);

                  // Header Title & Subtitle
                  label(body, "Chord Listener", 26, true);
                  label(body, "Select instrument, chord quality, and mode, then tap a root note.", 15, false);

                  // Controls Container
                  LinearLayout controlsLayout = new LinearLayout(this);
                  controlsLayout.setOrientation(LinearLayout.VERTICAL);
                  controlsLayout.setPadding(0, dp(12), 0, dp(12));

                  TextView instLabel = new TextView(this);
                  instLabel.setText("Instrument Tone");
                  instLabel.setTextSize(13);
                  controlsLayout.addView(instLabel);

                  instrumentSpinner = new Spinner(this);
                  instrumentSpinner.setAdapter(new ArrayAdapter<>(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      sounds
                  ));
                  controlsLayout.addView(instrumentSpinner);

                  TextView typeLabel = new TextView(this);
                  typeLabel.setText("Chord Quality");
                  typeLabel.setTextSize(13);
                  typeLabel.setPadding(0, dp(12), 0, 0);
                  controlsLayout.addView(typeLabel);

                  chordTypeSpinner = new Spinner(this);
                  chordTypeSpinner.setAdapter(new ArrayAdapter<>(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      chordTypeNames
                  ));
                  controlsLayout.addView(chordTypeSpinner);

                  TextView modeLabel = new TextView(this);
                  modeLabel.setText("Playback Mode");
                  modeLabel.setTextSize(13);
                  modeLabel.setPadding(0, dp(12), 0, 0);
                  controlsLayout.addView(modeLabel);

                  playbackModeSpinner = new Spinner(this);
                  playbackModeSpinner.setAdapter(new ArrayAdapter<>(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      playbackModeNames
                  ));
                  controlsLayout.addView(playbackModeSpinner);

                  body.addView(controlsLayout);

                  // Status Display Card
                  status = new TextView(this);
                  status.setText("Ready - tap a root note below");
                  status.setTextSize(15);
                  status.setPadding(dp(16), dp(16), dp(16), dp(16));
                  status.setBackgroundColor(0xFFE8EEF5);
                  body.addView(status, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ));

                  // Section Header for Root Notes
                  label(body, "Root Notes", 20, true);

                  // Root Note Buttons Grid (4 rows x 3 columns)
                  for (int rowIndex = 0; rowIndex < 4; rowIndex++) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setPadding(0, dp(4), 0, dp(4));

                      for (int columnIndex = 0; columnIndex < 3; columnIndex++) {
                          final int root = rowIndex * 3 + columnIndex;

                          Button button = new Button(this);
                          button.setAllCaps(false);
                          button.setText(roots[root]);
                          button.setTextSize(16);
                          button.setOnClickListener(view -> playSelectedChord(root));

                          LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                              0,
                              dp(52),
                              1f
                          );
                          params.setMargins(dp(4), 0, dp(4), 0);
                          row.addView(button, params);
                      }
                      body.addView(row);
                  }

                  // Action Buttons Row
                  LinearLayout actionRow = new LinearLayout(this);
                  actionRow.setOrientation(LinearLayout.HORIZONTAL);
                  actionRow.setPadding(0, dp(16), 0, dp(8));

                  Button replay = new Button(this);
                  replay.setText("Replay");
                  replay.setOnClickListener(view -> {
                      if (lastRoot >= 0) {
                          playSelectedChord(lastRoot);
                      }
                  });
                  LinearLayout.LayoutParams replayParams = new LinearLayout.LayoutParams(
                      0, dp(48), 1f
                  );
                  replayParams.setMargins(0, 0, dp(8), 0);
                  actionRow.addView(replay, replayParams);

                  Button stop = new Button(this);
                  stop.setText("Stop");
                  stop.setOnClickListener(view -> {
                      stopAudio();
                      status.setText("Playback stopped");
                  });
                  LinearLayout.LayoutParams stopParams = new LinearLayout.LayoutParams(
                      0, dp(48), 1f
                  );
                  stopParams.setMargins(dp(8), 0, 0, 0);
                  actionRow.addView(stop, stopParams);

                  body.addView(actionRow);

                  // Footer Note
                  label(body, "Offline MIDI synthesis. Headphones recommended.", 12, false);
              }

              private TextView label(LinearLayout body, String text, int size, boolean bold) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  if (bold) {
                      view.setTypeface(null, android.graphics.Typeface.BOLD);
                  }
                  view.setPadding(0, dp(8), 0, dp(8));
                  body.addView(view);
                  return view;
              }

              private void playSelectedChord(int root) {
                  stopAudio();
                  lastRoot = root;

                  int chordTypeIndex = chordTypeSpinner.getSelectedItemPosition();
                  int modeIndex = playbackModeSpinner.getSelectedItemPosition();
                  
                  int[] intervals = chordIntervals[chordTypeIndex];
                  int[] notes = new int[intervals.length];

                  for (int i = 0; i < intervals.length; i++) {
                      notes[i] = 60 + root + intervals[i];
                  }

                  int choice = instrumentSpinner.getSelectedItemPosition();
                  
                  // Mode 1 = Continuous Hold (long duration), Mode 2 = Repeating Loop
                  int durationTicks = (modeIndex == 1) ? 288000 : 1920; 
                  boolean isLooping = (modeIndex == 2);

                  StringBuilder noteNames = new StringBuilder();
                  for (int i = 0; i < intervals.length; i++) {
                      noteNames.append(roots[(root + intervals[i]) % 12]);
                      if (i < intervals.length - 1) noteNames.append(" - ");
                  }

                  status.setText(
                      roots[root] + " " + chordTypeNames[chordTypeIndex] + " (" + playbackModeNames[modeIndex] + ")\n" +
                      "Notes: " + noteNames.toString() + "\n" +
                      "Instrument: " + sounds[choice]
                  );

                  File file = new File(getCacheDir(), "chord_" + (fileNumber++) + ".mid");

                  try {
                      try (FileOutputStream output = new FileOutputStream(file)) {
                          output.write(makeMidi(notes, programs[choice], durationTicks));
                      }

                      MediaPlayer current = new MediaPlayer();
                      player = current;

                      current.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      );

                      current.setOnPreparedListener(mediaPlayer -> {
                          file.delete();
                          if (player == mediaPlayer) {
                              mediaPlayer.setLooping(isLooping);
                              mediaPlayer.start();
                          }
                      });

                      current.setOnCompletionListener(mediaPlayer -> {
                          if (player == mediaPlayer) {
                              player = null;
                              mediaPlayer.release();
                          }
                      });

                      current.setOnErrorListener((mediaPlayer, what, extra) -> {
                          file.delete();
                          if (player == mediaPlayer) {
                              player = null;
                              mediaPlayer.release();
                              status.setText("Playback failed. Try another chord.");
                          }
                          return true;
                      });

                      current.setDataSource(file.getAbsolutePath());
                      current.prepareAsync();

                  } catch (Exception exception) {
                      stopAudio();
                      file.delete();
                      status.setText("Cannot play: " + exception.getMessage());
                  }
              }

              private byte[] makeMidi(int[] notes, int program, int durationTicks) throws IOException {
                  ByteArrayOutputStream trackBytes = new ByteArrayOutputStream();
                  DataOutputStream track = new DataOutputStream(trackBytes);

                  track.write(new byte[] {
                      0, (byte) 0xFF, 0x51, 3, 7, (byte) 0xA1, 0x20
                  });

                  track.writeByte(0);
                  track.writeByte(0xC0);
                  track.writeByte(program);

                  for (int note : notes) {
                      track.writeByte(0);
                      track.writeByte(0x90);
                      track.writeByte(note);
                      track.writeByte(85);
                  }

                  for (int index = 0; index < notes.length; index++) {
                      variable(track, index == 0 ? durationTicks : 0);
                      track.writeByte(0x80);
                      track.writeByte(notes[index]);
                      track.writeByte(0);
                  }

                  variable(track, 480);
                  track.writeByte(0xFF);
                  track.writeByte(0x2F);
                  track.writeByte(0);
                  track.flush();

                  ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                  DataOutputStream output = new DataOutputStream(bytes);

                  output.writeBytes("MThd");
                  output.writeInt(6);
                  output.writeShort(0);
                  output.writeShort(1);
                  output.writeShort(480);
                  output.writeBytes("MTrk");
                  output.writeInt(trackBytes.size());
                  output.write(trackBytes.toByteArray());
                  output.flush();

                  return bytes.toByteArray();
              }

              private void variable(DataOutputStream output, int value) throws IOException {
                  int packed = value & 127;
                  while ((value >>>= 7) > 0) {
                      packed = (packed << 8) | ((value & 127) | 128);
                  }
                  while (true) {
                      output.writeByte(packed & 255);
                      if ((packed & 128) == 0) {
                          break;
                      }
                      packed >>>= 8;
                  }
              }

              private void stopAudio() {
                  if (player != null) {
                      player.setOnPreparedListener(null);
                      player.setOnCompletionListener(null);
                      player.setOnErrorListener(null);
                      player.release();
                      player = null;
                  }

                  File[] files = getCacheDir().listFiles();
                  if (files != null) {
                      for (File file : files) {
                          if (file.getName().startsWith("chord_")) {
                              file.delete();
                          }
                      }
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  stopAudio();
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density
                  );
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chord-Listener-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
